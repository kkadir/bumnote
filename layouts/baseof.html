<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection "ltr" }}">
<head>
{{- partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">{{ T "skip_to_content" }}</a>
{{ partial "header.html" . }}
<main id="main" class="main">

</main>
{{ partial "footer.html" . }}
{{ partial "scripts.html" . }}
</body>
</html>
