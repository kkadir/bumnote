{{- $id := .id }}{{ $kind := .kind }}
<svg class="plate__svg plate__svg--{{ $kind }}" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="dots-{{ $id }}" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="6" cy="6" r="3.4" fill="currentColor"/></pattern>
    <pattern id="fine-{{ $id }}" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="6" cy="6" r="1.3" fill="currentColor"/></pattern>
    <pattern id="hatch-{{ $id }}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="10" fill="currentColor"/></pattern>
    <radialGradient id="fade-{{ $id }}" cx="28%" cy="50%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="mask-{{ $id }}"><rect width="800" height="360" fill="url(#fade-{{ $id }})"/></mask>
  </defs>
  {{- if eq $kind "halftone" }}
  <rect width="800" height="360" fill="url(#fine-{{ $id }})" opacity=".5"/>
  <rect width="800" height="360" fill="url(#dots-{{ $id }})" mask="url(#mask-{{ $id }})"/>
  <circle cx="590" cy="180" r="118" class="plate__accent"/>
  <circle cx="590" cy="180" r="118" fill="url(#dots-{{ $id }})" opacity=".3"/>
  <rect x="36" y="36" width="728" height="288" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6"/>
  {{- else if eq $kind "hatch" }}
  <rect width="800" height="360" fill="url(#hatch-{{ $id }})" opacity=".85"/>
  <rect x="110" y="56" width="580" height="248" class="plate__paper" stroke="currentColor" stroke-width="3"/>
  <rect x="140" y="86" width="520" height="188" class="plate__accent"/>
  <rect x="140" y="86" width="520" height="188" fill="url(#hatch-{{ $id }})" opacity=".22"/>
  <line x1="110" y1="180" x2="690" y2="180" stroke="currentColor" stroke-width="2" stroke-dasharray="4 8"/>
  {{- else }}
  <rect width="800" height="360" fill="url(#fine-{{ $id }})" opacity=".3"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="currentColor" stroke-width="2"/>
  {{- range $i := seq 0 79 }}
  {{- $x := mul $i 10 }}
  {{- $f := float $i }}
  {{- $h := add 24 (mul 110 (math.Abs (add (math.Sin (mul $f 0.37)) (mul 0.55 (math.Sin (mul $f 1.31)))))) }}
  {{- $h = math.Min $h 165 }}
  <rect x="{{ add $x 2 }}" y="{{ sub 180 $h }}" width="6" height="{{ mul $h 2 }}" fill="currentColor"{{ if eq (mod $i 9) 0 }} class="plate__accent"{{ end }}/>
  {{- end }}
  {{- end }}
</svg>
